<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Three.js Stylized PBR Character Test v27</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#65cbf1;font-family:Arial,sans-serif}#app{width:100%;height:100%}#info{position:fixed;left:14px;top:14px;padding:10px 12px;background:#1b1725c9;color:#fff;border-radius:9px;font-size:13px;line-height:1.5;z-index:2;backdrop-filter:blur(5px)}#status{color:#bdeaff}
#light-ui{margin-top:8px;min-width:230px}
#light-ui label{display:flex;justify-content:space-between;gap:12px;margin-bottom:4px}
#lightAngle{width:100%;accent-color:#65cbf1}

#joystickZone{position:fixed;left:18px;bottom:18px;width:150px;height:150px;z-index:30;touch-action:none;user-select:none}
#joyBase{position:absolute;inset:15px;border-radius:50%;background:rgba(18,45,62,.26);border:1px solid rgba(255,255,255,.38);backdrop-filter:blur(4px)}
#joyStick{position:absolute;left:50%;top:50%;width:58px;height:58px;margin:-29px;border-radius:50%;background:rgba(255,255,255,.58);border:1px solid rgba(255,255,255,.8);box-shadow:0 4px 18px rgba(0,0,0,.18);transform:translate(0,0)}
#lightToggle{position:fixed;right:12px;top:12px;z-index:40;border:0;border-radius:12px;padding:9px 12px;background:rgba(10,28,38,.62);color:#fff;font-weight:700;backdrop-filter:blur(6px)}
#ui.uiHidden{display:none}
@media(max-width:600px){#info{font-size:11px;max-width:55vw}#joystickZone{left:10px;bottom:12px;width:138px;height:138px}#lightToggle{font-size:12px;padding:8px 10px}}
</style>
</head>
<body>
<div id="app"></div>
<div id="info"><b>Stylized PBR v27</b><br><span id="status">Loading...</span><br>Drag: 회전 / Wheel: 줌
<div id="light-ui">
<label for="lightAngle">Main Light 회전 <span id="angleValue">0°</span></label>
<input id="lightAngle" type="range" min="-180" max="180" value="0" step="1">
</div></div>

<div id="joystickZone"><div id="joyBase"><div id="joyStick"></div></div></div>
<button id="lightToggle">UI ✕</button>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const app=document.querySelector('#app');
const status=document.querySelector('#status');
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x65cbf1);

const camera=new THREE.PerspectiveCamera(30,innerWidth/innerHeight,0.01,1000);
camera.position.set(0,1.25,4.2);

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.08;
app.appendChild(renderer.domElement);

const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0,1.05,0);
controls.enableDamping=true;
controls.minDistance=1.45;
controls.maxDistance=8;

// Soft stylized-PBR lighting: broad front key + gentle fill + subtle rim.
scene.add(new THREE.HemisphereLight(0xfff8f1,0x77708c,2.35));
const key=new THREE.DirectionalLight(0xfff2e5,2.05);
const keyHeight=5.5;
const keyRadius=5.6;
key.castShadow=true;
key.shadow.mapSize.set(4096,4096); key.shadow.bias=-0.00015;
key.shadow.camera.left=-12;key.shadow.camera.right=12;key.shadow.camera.top=12;key.shadow.camera.bottom=-12;
key.shadow.camera.near=0.1;key.shadow.camera.far=40;
scene.add(key);

// Main-light azimuth control. 0° = current front-side direction.
// Rotate this slider until the cast shadow falls exactly where you want.
const lightAngle=document.querySelector('#lightAngle');
const angleValue=document.querySelector('#angleValue');
function updateKeyLight(){
  const deg=Number(lightAngle.value);
  const rad=THREE.MathUtils.degToRad(deg);
  const base=Math.atan2(0.8,5.5);
  key.position.set(
    Math.sin(base+rad)*keyRadius,
    keyHeight,
    Math.cos(base+rad)*keyRadius
  );
  key.target.position.set(0,1.0,0);
  scene.add(key.target);
// Afternoon sun: higher elevation for a shorter 3–4pm-style shadow.
key.position.set(-10,18,8);
  angleValue.textContent=`${deg}°`;
}
lightAngle.addEventListener('input',updateKeyLight);
updateKeyLight();
const fill=new THREE.DirectionalLight(0xe8e2ff,0.8); fill.position.set(-3,2.5,4); scene.add(fill);
const rim=new THREE.DirectionalLight(0xb9c9ff,0.55); rim.position.set(-3.5,3,-4); scene.add(rim);

const floorGeo=new THREE.CircleGeometry(3.6,96);
// Base floor is unlit so it matches the background color exactly.
const floorMat=new THREE.MeshBasicMaterial({color:0x65cbf1});
floorMat.toneMapped=false;
const floor=new THREE.Mesh(floorGeo,floorMat);
floor.rotation.x=-Math.PI/2; scene.add(floor);
// Separate transparent receiver keeps the exact floor color while still showing shadows.
const shadowFloor=new THREE.Mesh(floorGeo,new THREE.ShadowMaterial({color:0x234b5a,opacity:0.24,transparent:true}));
shadowFloor.rotation.x=-Math.PI/2; shadowFloor.position.y=0.002; shadowFloor.receiveShadow=true; scene.add(shadowFloor);

let mixer=null, character=null, idleAction=null, walkAction=null, currentAction=null;

// --- simple game controls: D-pad + WASD / arrow keys ---
const move={forward:false,back:false,left:false,right:false};
const analog={x:0,z:0,active:false};
const MOVE_SPEED=1.25, TURN_SPEED=2.2;
const lastCharacterPos=new THREE.Vector3();
let followReady=false;
let targetYaw=0;

function setAnim(next){
  if(!next || next===currentAction) return;
  next.reset().play();
  if(currentAction) currentAction.crossFadeTo(next,0.28,true);
  currentAction=next;
}
function updateAnim(){
  const moving=analog.active || move.forward||move.back||move.left||move.right;
  setAnim(moving ? walkAction : idleAction);
}
const keyMap={
  ArrowUp:'forward',KeyW:'forward',
  ArrowDown:'back',KeyS:'back',
  ArrowLeft:'left',KeyA:'left',
  ArrowRight:'right',KeyD:'right'
};
window.addEventListener('keydown',e=>{
  const k=keyMap[e.code]; if(!k)return;
  move[k]=true; updateAnim(); e.preventDefault();
});
window.addEventListener('keyup',e=>{
  const k=keyMap[e.code]; if(!k)return;
  move[k]=false; updateAnim(); e.preventDefault();
});



// Floating analog joystick: press anywhere in the pad, then drag continuously.
const joyZone=document.getElementById('joystickZone');
const joyStick=document.getElementById('joyStick');
let joyPointer=null;
function setJoyFromEvent(e){
  const r=joyZone.getBoundingClientRect();
  const cx=r.left+r.width/2, cy=r.top+r.height/2;
  let dx=e.clientX-cx, dy=e.clientY-cy;
  const max=r.width*0.34;
  const len=Math.hypot(dx,dy);
  if(len>max){ dx=dx/len*max; dy=dy/len*max; }
  analog.x=-dx/max;
  analog.z=-dy/max;
  analog.active=Math.hypot(analog.x,analog.z)>0.12;
  joyStick.style.transform=`translate(${dx}px,${dy}px)`;
  updateAnim();
}
joyZone.addEventListener('pointerdown',e=>{
  joyPointer=e.pointerId; joyZone.setPointerCapture(e.pointerId);
  setJoyFromEvent(e); e.preventDefault();
});
joyZone.addEventListener('pointermove',e=>{
  if(e.pointerId!==joyPointer)return;
  setJoyFromEvent(e); e.preventDefault();
});
function endJoy(e){
  if(joyPointer!==null && e.pointerId!==joyPointer)return;
  joyPointer=null; analog.x=0; analog.z=0; analog.active=false;
  joyStick.style.transform='translate(0,0)'; updateAnim();
}
joyZone.addEventListener('pointerup',endJoy);
joyZone.addEventListener('pointercancel',endJoy);

const lightToggle=document.getElementById('lightToggle');
const lightUI=document.getElementById('ui');
let leftUIVisible=true;
const infoUI=document.getElementById('info');
lightToggle.textContent='UI ✕';
lightToggle.addEventListener('click',()=>{
  leftUIVisible=!leftUIVisible;
  const display=leftUIVisible?'block':'none';
  lightUI.style.setProperty('display',display,'important');
  if(infoUI) infoUI.style.setProperty('display',display,'important');
  lightToggle.textContent=leftUIVisible?'UI ✕':'UI ☰';
});

// Fixed square columns: world-space scenery. They never move with the character.
const obstacleGroup=new THREE.Group();
scene.add(obstacleGroup);
const obstaclePalette=[0xff6b6b,0xffc857,0x6bdb8a,0x5bbcff,0x9d7cff,0xff7ac8,0x62d7d1,0xff934f];

function makeFixedBox(x,z){
  const w=.7+Math.random()*.7;
  const d=.7+Math.random()*.7;
  const h=.75+Math.random()*1.5;
  const box=new THREE.Mesh(
    new THREE.BoxGeometry(w,h,d),
    new THREE.MeshStandardMaterial({
      color:obstaclePalette[Math.floor(Math.random()*obstaclePalette.length)],
      roughness:.72, metalness:.02
    })
  );
  box.position.set(x,h/2,z);
  box.rotation.y=Math.random()*Math.PI;
  box.castShadow=true;
  box.receiveShadow=true;
  obstacleGroup.add(box);
}

// Sparse fixed landmarks around the starting area.
// Keep the center clear so the player can walk around and reach every box.
const fixedBoxPositions=[
  [-3,-2],[3,-2],[-4,2],[4,2],
  [-2,5],[2,5],[-5,6],[5,6],
  [0,-5],[-6,-3],[6,-3],[0,8]
];
for(const [x,z] of fixedBoxPositions) makeFixedBox(x,z);

// Simple player collision against the fixed box landmarks.
// Character uses a small XZ circle; boxes use their world-space AABB.
const PLAYER_RADIUS=0.42;

function playerHitsObstacle(pos){
  for(const box of obstacleGroup.children){
    const halfX=(box.geometry.parameters.width||1)*0.5;
    const halfZ=(box.geometry.parameters.depth||1)*0.5;

    // Boxes may be rotated, so use a world-space Box3 for reliable bounds.
    const bounds=new THREE.Box3().setFromObject(box);
    const closestX=THREE.MathUtils.clamp(pos.x,bounds.min.x,bounds.max.x);
    const closestZ=THREE.MathUtils.clamp(pos.z,bounds.min.z,bounds.max.z);
    const dx=pos.x-closestX;
    const dz=pos.z-closestZ;
    if(dx*dx+dz*dz < PLAYER_RADIUS*PLAYER_RADIUS) return true;
  }
  return false;
}

function updateMovement(dt){
  if(!character)return;

  if(!followReady){
    lastCharacterPos.copy(character.position);
    followReady=true;
  }

  // Game-style directional movement:
  // Up/Down reverse instantly; Left/Right turn instantly to the new direction.
  let x=analog.active ? analog.x : 0;
  let z=analog.active ? analog.z : 0;
  if(!analog.active){
    if(move.forward) z+=1;
    if(move.back) z-=1;
    if(move.left) x-=1;
    if(move.right) x+=1;
  }

  if(x!==0 || z!==0){
    const inputDir=new THREE.Vector3(x,0,z).normalize();

    // Camera-relative controls. Up = visually forward on screen, Down = backward.
    const camForward=new THREE.Vector3();
    camera.getWorldDirection(camForward);
    camForward.y=0;
    if(camForward.lengthSq()<0.0001) camForward.set(0,0,-1);
    camForward.normalize();
    const camRight=new THREE.Vector3().crossVectors(new THREE.Vector3(0,1,0),camForward).normalize();

    // Fix the previous up/down inversion.
    const worldDir=new THREE.Vector3()
      .addScaledVector(camForward,inputDir.z)
      .addScaledVector(camRight,inputDir.x)
      .normalize();

    // Smoothly rotate toward the requested direction instead of snapping.
    targetYaw=Math.atan2(-worldDir.x,-worldDir.z);
    let diff=targetYaw-character.rotation.y;
    diff=Math.atan2(Math.sin(diff),Math.cos(diff));
    const turnBlend=1-Math.exp(-10*dt);
    character.rotation.y += diff*turnBlend;

    const moveStep=worldDir.clone().multiplyScalar(MOVE_SPEED*dt);

    // X and Z are tested separately so the player can slide along walls/boxes.
    const tryX=character.position.clone();
    tryX.x+=moveStep.x;
    if(!playerHitsObstacle(tryX)) character.position.x=tryX.x;

    const tryZ=character.position.clone();
    tryZ.z+=moveStep.z;
    if(!playerHitsObstacle(tryZ)) character.position.z=tryZ.z;
  }

  // Camera follows the character, but the WORLD stays fixed.
  // Move only camera + OrbitControls target by the character's delta.
  const delta=character.position.clone().sub(lastCharacterPos);
  delta.y=0;
  if(delta.lengthSq()>0){
    camera.position.add(delta);
    controls.target.add(delta);

    // Keep the finite shadow receiver and directional-light target with the player.
    // Obstacles are NOT moved, so they remain reachable fixed world objects.
    floor.position.x=character.position.x;
    floor.position.z=character.position.z;
    shadowFloor.position.x=character.position.x;
    shadowFloor.position.z=character.position.z;
    key.target.position.x=character.position.x;
    key.target.position.z=character.position.z;
  }
  lastCharacterPos.copy(character.position);
}

const clock=new THREE.Clock();
new GLTFLoader().load('./TestAnime.glb',(gltf)=>{
  const model=gltf.scene;
  scene.add(model);
  model.traverse(o=>{
    if(!o.isMesh) return;
    o.castShadow=true; o.receiveShadow=true;
    const mats=Array.isArray(o.material)?o.material:[o.material];
    mats.forEach(m=>{
      if(!m) return;
      // Keep original GLB PBR/textures. Only soften response where supported.
      if('roughness' in m) m.roughness=Math.max(m.roughness ?? 0.5,0.62);
      if('metalness' in m) m.metalness=Math.min(m.metalness ?? 0,0.05);
      m.needsUpdate=true;
    });
  });

  const box=new THREE.Box3().setFromObject(model);
  const size=box.getSize(new THREE.Vector3());
  const center=box.getCenter(new THREE.Vector3());
  model.position.x-=center.x; model.position.z-=center.z; model.position.y-=box.min.y;
  controls.target.set(0,Math.max(size.y*0.54,0.7),0);
  camera.position.set(0,Math.max(size.y*0.57,1),Math.max(size.y*1.75,3));
  controls.update();

  if(gltf.animations.length){
    mixer=new THREE.AnimationMixer(model);
    character=model;
    lastCharacterPos.copy(character.position);
    followReady=true;

    const idleClip=THREE.AnimationClip.findByName(gltf.animations,'Idle');
    const walkClip=THREE.AnimationClip.findByName(gltf.animations,'Walk');
    if(idleClip) idleAction=mixer.clipAction(idleClip);
    if(walkClip) walkAction=mixer.clipAction(walkClip);
    if(idleAction){ idleAction.play(); currentAction=idleAction; }
    status.textContent=`OK · Idle / Walk`;
  } else status.textContent='Model OK · Animation 없음';
},undefined,(err)=>{console.error(err);status.textContent='GLB 로딩 실패 · Console 확인';});

function animate(){requestAnimationFrame(animate);const dt=clock.getDelta();if(mixer)mixer.update(dt);
  updateMovement(dt);controls.update();renderer.render(scene,camera);}animate();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
</script>
</body></html>
